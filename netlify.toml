# Netlify Configuration for Gloop Runner
[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/play"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/game"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/gloop"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
