<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

<div style="background: #4f46e5; padding: 12px 18px; margin-bottom: 20px; border-radius: 8px; font-family: sans-serif; display: flex; justify-content: space-between; align-items: center; color: white;">
    <span>🚀 <strong>New:</strong> Smart To-Do List App with Reminders is ready!</span>
    <a href="todo.html" style="background: white; color: #4f46e5; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: bold;">Open To-Do App &rarr;</a>
</div>

<h2>Student Registration Form</h2>

<form>
    <table border="1" cellpadding="5">
        <tr>
            <td>Name</td>
            <td><input type="text"></td>
        </tr>

        <tr>
            <td>Email</td>
            <td><input type="email"></td>
        </tr>

        <tr>
            <td>Password</td>
            <td><input type="password"></td>
        </tr>

        <tr>
            <td>Gender</td>
            <td>
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender"> Female
            </td>
        </tr>

        <tr>
            <td>Hobbies</td>
            <td>
                <input type="checkbox"> Reading
                <input type="checkbox"> Music
                <input type="checkbox"> Sports
            </td>
        </tr>

        <tr>
            <td colspan="2" align="center">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </td>
        </tr>
    </table>
</form>

</body>
</html>
